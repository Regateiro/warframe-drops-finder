[project]
name = "warframe"
version = "0.1.0"
description = "Search Warframe drop tables"
authors = [
    {name = "Diogo Regateiro",email = "diogo.regateiro@atlar.pt"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
flake8 = "^7.3.0"
isort = "^6.0.1"
pylint = "^3.3.7"
pytest = "^8.3.0"


[tool.poetry.group.runtime.dependencies]
flask = "^3.1.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
