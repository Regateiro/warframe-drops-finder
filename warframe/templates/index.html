<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warframe Drop Locations</title>
    <link rel="icon" type="image/png" href="{{ web_root }}/static/favicon.png">
    <link rel="stylesheet" href="{{ web_root }}/static/style.css">
    <script src="{{ web_root }}/static/autocomplete.js"></script>
    <script>var WEB_ROOT = "{{ web_root }}";</script>
</head>
<body>
    <div class="header">
        <h1>Warframe Drop Locations</h1>
        <a class="btn" href="{{ web_root }}/?refresh=1&{{ refresh_qs }}">Refresh Data</a>
    </div>
    <form method="get" action="{{ web_root }}/">
        <input type="text" name="q" placeholder="Search for an item..." value="{{ query }}" autofocus>
        <input type="number" name="n" value="{{ max_results or '' }}" min="0" placeholder="Max">
        <button type="submit">Search</button>
        <button type="button" class="btn-drawer" onclick="toggleDrawer()">Advanced</button>
        <div class="drawer" id="drawer">
            <div class="drawer-content">
                <label>
                    Mission Type Filter:
                    <input type="text" name="mission_type" value="{{ mission_type }}" placeholder="Mission type (e.g. Defense, Survival)">
                </label>
                <label>
                    <input type="checkbox" name="partial" {{ partial_checked }}> Partial match
                </label>
            </div>
        </div>
    </form>
    {% if results_html %}
    {{ results_html|safe }}
    {% elif query %}
    <p>No drops found for "{{ query }}".</p>
    {% endif %}
</body>
</html>
